name: iOS tests

# The Objective-C and the device tests on an iOS simulator: no phone, no Bluetooth, and no system prompt to answer. The two jobs are
# independent and run side by side. Called by ci.yaml when something they cover changes, and for every push to main.
on:
  workflow_call:

jobs:
  # The Objective-C of src/ios against cordova-ios, with XCTest.
  xctest:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npm install --no-audit --no-fund
      - run: npm run test:ios:coverage
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-ios
          path: coverage/ios.json
          if-no-files-found: ignore
      # A cancelled run leaves xcodebuild and the simulator running, which slows the runner's own clean-up for minutes.
      - name: Stop what the tests left running
        if: always()
        run: |
          pkill -f '[c]ordova-paramedic' || true
          pkill -f '[x]codebuild' || true
          xcrun simctl shutdown all || true

  # tests/ (the device tests) in an app on the simulator, with the plugin installed the way an app installs it.
  paramedic:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npm install --no-audit --no-fund
      # cordova-paramedic checks the requirements of a device build first, and refuses to start without ios-deploy
      # even though a simulator run does not use it.
      - run: brew install ios-deploy
      - run: npm run test:paramedic:ios:simulator
      # A cancelled run leaves xcodebuild and the simulator running, which slows the runner's own clean-up for minutes.
      - name: Stop what the tests left running
        if: always()
        run: |
          pkill -f '[c]ordova-paramedic' || true
          pkill -f '[x]codebuild' || true
          xcrun simctl shutdown all || true
