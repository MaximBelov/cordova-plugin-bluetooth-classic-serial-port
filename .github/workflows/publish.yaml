name: Publishing

# Publishes the version in package.json to npm when that version is not published yet: a push to main publishes it as `latest`, a
# push to develop as `next`. A push that keeps the version publishes nothing, so a release is a version bump merged to main.
# Nothing is published unless the tests pass: the unit, the iOS simulator and the Android tests run first.
#
# It signs in with npm's trusted publishing (OpenID Connect), so there is no token to expire. That needs this repository and this
# workflow file (publish.yaml) to be set as the package's trusted publisher: npmjs.com > the package > Settings > Trusted Publisher.
on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

concurrency:
  group: publishing
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yaml
  test-ios:
    uses: ./.github/workflows/test-ios.yaml
  test-android:
    uses: ./.github/workflows/test-android.yaml

  build:
    needs: [test, test-ios, test-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # npm 11.5 or newer is needed for trusted publishing
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # a publishing job does not restore a dependency cache (setup-node's advice for trusted publishing)
          package-manager-cache: false
      - name: Publish a version that is new
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published: nothing to do"
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            npm publish
          else
            npm publish --tag next
          fi
