name: Android tests

# The Java of src/android on the JVM with Robolectric, and the device tests of tests/ on an Android emulator, where the plugin is
# installed into an app the way an app installs it and what an emulator without Bluetooth can answer is checked. Linux with KVM.
# Called by pull-request.yaml when something it covers changes, and by publish.yaml.
on:
  workflow_call:

jobs:
  # No emulator and no Bluetooth: the plugin's Java built against cordova-android's framework.
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: npm run test:android:coverage
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-android
          path: test/android/plugin/build/reports/coverage/test/debug
          if-no-files-found: ignore

  paramedic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npm install --no-audit --no-fund
      # An emulator needs hardware acceleration, which the runner allows to everyone once /dev/kvm is open.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          script: ANDROID_SERIAL=emulator-5554 npm run test:paramedic:android
